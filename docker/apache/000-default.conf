ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # /resume is both a route and a folder of PDFs; don't redirect to /resume/
        DirectorySlash Off
    </Directory>

    # Like Herd/nginx try_files: only real files are served directly, so
    # directories (public/resume) fall through to Laravel
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule ^ /index.php [L]

    # Requests arrive via the shared Traefik proxy; log the real client IP
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12

    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log proxied
</VirtualHost>
